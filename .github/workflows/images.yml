name: Images

# Builds and pushes the backend container images to GHCR on every push to main.
# This is the fast, cheap path that feeds Dokploy (which pulls :latest).
# Desktop release packaging is handled separately by release.yml on version tags.

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/desktop/**"
      - "apps/web/**"
      - "docs/**"
      - ".context/**"
      - "**.md"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-docker-realtime:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
            docker_platform: linux/amd64
          - platform: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@adc691ae88ab0b60a1ea3db000af973ad0f8dbfd

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        shell: bash
        run: echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build and push realtime image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850
        with:
          context: .
          file: apps/realtime/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/realtime:latest-${{ matrix.platform }}
            ghcr.io/${{ github.repository }}/realtime:${{ env.SHA_SHORT }}-${{ matrix.platform }}
          platforms: ${{ matrix.docker_platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  build-docker-control:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
            docker_platform: linux/amd64
          - platform: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@adc691ae88ab0b60a1ea3db000af973ad0f8dbfd

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        shell: bash
        run: echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build and push control image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850
        with:
          context: .
          file: apps/control/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/control:latest-${{ matrix.platform }}
            ghcr.io/${{ github.repository }}/control:${{ env.SHA_SHORT }}-${{ matrix.platform }}
          platforms: ${{ matrix.docker_platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  build-docker-workers:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
            docker_platform: linux/amd64
          - platform: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@adc691ae88ab0b60a1ea3db000af973ad0f8dbfd

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        shell: bash
        run: echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build and push workers image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850
        with:
          context: .
          file: apps/workers/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/workers:latest-${{ matrix.platform }}
            ghcr.io/${{ github.repository }}/workers:${{ env.SHA_SHORT }}-${{ matrix.platform }}
          platforms: ${{ matrix.docker_platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  push-manifests:
    needs: [build-docker-realtime, build-docker-control, build-docker-workers]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@adc691ae88ab0b60a1ea3db000af973ad0f8dbfd

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        shell: bash
        run: echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Create and push multi-arch manifests
        shell: bash
        run: |
          #!/bin/bash
          # shellcheck disable=SC2086
          for img in realtime control workers; do
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository }}/$img:latest \
              ghcr.io/${{ github.repository }}/$img:latest-amd64 \
              ghcr.io/${{ github.repository }}/$img:latest-arm64

            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository }}/$img:${{ env.SHA_SHORT }} \
              ghcr.io/${{ github.repository }}/$img:${{ env.SHA_SHORT }}-amd64 \
              ghcr.io/${{ github.repository }}/$img:${{ env.SHA_SHORT }}-arm64
          done

  # Scan the freshly-built images for known vulnerabilities (high/critical
  # severities fail the build). Blocks shipping images with unpatched CVEs.
  scan:
    needs: [push-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225

      - name: Get short SHA
        shell: bash
        run: echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan control image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ github.repository }}/control:${{ env.SHA_SHORT }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan realtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ github.repository }}/realtime:${{ env.SHA_SHORT }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan workers image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ github.repository }}/workers:${{ env.SHA_SHORT }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  # Boot the freshly-built images against an ephemeral postgres+redis and
  # verify they start and serve /health. Catches crash-on-boot defects (e.g.
  # unresolvable @prisma/client) before the image reaches production.
  smoke-test:
    needs: [push-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225

      - name: Get short SHA
        shell: bash
        run: echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start ephemeral postgres and redis
        run: |
          docker network create smoke-net
          docker run -d --name smoke-pg --network smoke-net \
            -e POSTGRES_USER=larity_user -e POSTGRES_PASSWORD=smoke_pass -e POSTGRES_DB=larity \
            pgvector/pgvector:pg16
          docker run -d --name smoke-redis --network smoke-net redis:7-alpine

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec smoke-pg pg_isready -U larity_user >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec smoke-pg pg_isready -U larity_user

      - name: Boot control image and check health
        run: |
          docker run -d --name smoke-control --network smoke-net \
            -p 3000:3000 \
            -e DATABASE_URL="postgresql://larity_user:smoke_pass@smoke-pg:5432/larity?schema=public" \
            -e REDIS_URL="redis://smoke-redis:6379" \
            -e BETTER_AUTH_SECRET="smoke_test_secret_that_is_long_enough_000000" \
            -e BETTER_AUTH_URL="http://localhost:3000" \
            -e FRONTEND_URL="http://localhost:3000" \
            -e FRONTEND_URLS="tauri://localhost,http://tauri.localhost" \
            -e LOG_LEVEL="error" \
            ghcr.io/${{ github.repository }}/control:${{ env.SHA_SHORT }}
          for i in $(seq 1 60); do
            body=$(curl -sf -m 2 http://localhost:3000/health 2>/dev/null) && break
            sleep 2
          done
          echo "health: ${body}"
          echo "$body" | grep -q '"status":"ok"' || { echo "control health check FAILED"; exit 1; }

      - name: Boot workers image and check health
        run: |
          docker run -d --name smoke-workers --network smoke-net \
            -p 8080:8080 \
            -e DATABASE_URL="postgresql://larity_user:smoke_pass@smoke-pg:5432/larity?schema=public" \
            -e REDIS_URL="redis://smoke-redis:6379" \
            -e LOG_LEVEL="error" \
            -e DEEPGRAM_API_KEY="smoke" \
            -e GEMINI_API_KEY="smoke" \
            -e SAMBANOVA_API_KEY="smoke" \
            -e S3_ENDPOINT="https://smoke.invalid" \
            -e S3_REGION="auto" \
            -e S3_ACCESS_KEY_ID="smoke" \
            -e S3_SECRET_ACCESS_KEY="smoke" \
            -e S3_AUDIO_BUCKET="smoke" \
            ghcr.io/${{ github.repository }}/workers:${{ env.SHA_SHORT }}
          for i in $(seq 1 30); do
            body=$(curl -sf -m 2 http://localhost:8080/health 2>/dev/null) && break
            sleep 1
          done
          echo "workers health: ${body}"
          echo "$body" | grep -q '"status":"ok"' || { echo "workers health check FAILED"; exit 1; }

      - name: Boot realtime image and check readiness
        run: |
          docker run -d --name smoke-realtime --network smoke-net \
            -e REDIS_URL="redis://smoke-redis:6379" \
            -e DEEPGRAM_API_KEY="smoke" \
            -e S3_ENDPOINT="https://smoke.invalid" \
            -e S3_REGION="auto" \
            -e S3_ACCESS_KEY_ID="smoke" \
            -e S3_SECRET_ACCESS_KEY="smoke" \
            -e S3_AUDIO_BUCKET="smoke" \
            ghcr.io/${{ github.repository }}/realtime:${{ env.SHA_SHORT }}
          for i in $(seq 1 30); do
            docker logs smoke-realtime 2>&1 | grep -q "Realtime plane is ready" && break
            sleep 1
          done
          docker logs smoke-realtime 2>&1 | tail -2
          docker logs smoke-realtime 2>&1 | grep -q "Realtime plane is ready"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smoke-control smoke-workers smoke-realtime smoke-pg smoke-redis >/dev/null 2>&1 || true
          docker network rm smoke-net >/dev/null 2>&1 || true

  # Trigger the Dokploy deploy once images are built and smoke-tested.
  # Requires DOKPLOY_API_KEY secret (generated in Dokploy profile → API/CLI).
  deploy-dokploy:
    needs: [smoke-test, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_ORIGIN_IP: ${{ secrets.DOKPLOY_ORIGIN_IP }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$COMPOSE_ID" ]; then
            echo "::warning::DOKPLOY_API_KEY or DOKPLOY_COMPOSE_ID not set — skipping auto-deploy"
            exit 0
          fi
          # GitHub runner IPs hit a Cloudflare JS challenge (HTTP 403) on
          # dokploy.aamn.dev, so bypass it by resolving the hostname to the
          # GCE origin's static IP directly (kept as a repo secret).
          if [ -n "$DOKPLOY_ORIGIN_IP" ]; then
            RESOLVE_ARGS=(--resolve "dokploy.aamn.dev:443:${DOKPLOY_ORIGIN_IP}")
          else
            RESOLVE_ARGS=()
          fi
          curl -sS --retry 3 --retry-delay 5 "${RESOLVE_ARGS[@]}" \
            -X POST "https://dokploy.aamn.dev/api/compose.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -d "{\"composeId\":\"${COMPOSE_ID}\",\"title\":\"auto-deploy ${GITHUB_SHA}\"}" \
            -w "\nHTTP_STATUS:%{http_code}\n"
