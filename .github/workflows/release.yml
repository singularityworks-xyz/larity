name: "Release Desktop App"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        # Build for Linux, Windows, and macOS
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun x prisma generate

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These environment variables are baked into the application by Vite at build time.
          # You should set these in your GitHub repository's Actions Secrets or Variables.
          VITE_CONTROL_URL: ${{ vars.VITE_CONTROL_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        with:
          projectPath: "./apps/desktop"
          tagName: "v__VERSION__" 
          releaseName: "Larity Desktop Beta v__VERSION__"
          releaseBody: "Beta release for macOS, Windows, and Linux."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
