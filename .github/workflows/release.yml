name: Release

# Publishes a GitHub Release (desktop installers + checksums).
# Triggered manually by pushing a version tag (e.g. v0.0.43).
# Backend container images are built on every push to main by images.yml.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-desktop-linux:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      VITE_CONTROL_URL: ${{ secrets.VITE_CONTROL_URL }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Restore Node Modules cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        with:
          projectPath: "./apps/desktop"
          args: --bundles deb,rpm
          includeRelease: true

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 3

  build-desktop-linux-appimage:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      VITE_CONTROL_URL: ${{ secrets.VITE_CONTROL_URL }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225

      - name: Build AppImage on Arch Linux
        run: |
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            -e VITE_CONTROL_URL="$VITE_CONTROL_URL" \
            -e VITE_WS_URL="$VITE_WS_URL" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            archlinux:latest bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                base-devel git curl wget file openssl pkg-config unzip bun \
                webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg patchelf alsa-lib \
                gst-plugins-base gst-plugins-good xdg-utils
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
              # Prevent bun from self-switching (packageManager field vs
              # pacman's canary build) which clobbers the binary as root.
              sed -i '/"packageManager":/d' package.json
              bun install --frozen-lockfile
              cd apps/desktop
              # Arch binaries use .relr.dyn ELF sections that linuxdeploy's
              # bundled strip can't parse; skip stripping (release build is
              # already stripped by cargo).
              NO_STRIP=1 bun x tauri build --bundles appimage
              cd /app
              chown -R "$HOST_UID:$HOST_GID" apps/desktop/src-tauri/target/release/bundle/appimage
            '

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 3

  build-desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_CONTROL_URL: ${{ secrets.VITE_CONTROL_URL }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        with:
          projectPath: "./apps/desktop"
          includeRelease: true

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3

  create-release:
    needs: [build-desktop-linux, build-desktop-linux-appimage, build-desktop-windows]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}

      - name: Derive Version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download Linux Desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-linux
          path: artifacts-linux

      - name: Download AppImage artifact (built on Arch)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-appimage
          path: artifacts-linux/appimage

      - name: Download Windows Desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-windows
          path: artifacts-windows

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@adc691ae88ab0b60a1ea3db000af973ad0f8dbfd

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Desktop Artifacts to Match Release Version
        shell: bash
        run: |
          set -euo pipefail
          # Tauri already names artifacts with the version; only rename when
          # the source differs from the target (mv errors on same-file).
          rename_one() {
            local src="$1" dst="$2"
            [ -e "$src" ] || return 0
            [ "$(readlink -f "$src")" = "$(readlink -f "$dst")" ] && return 0
            mv -f "$src" "$dst"
          }
          # Rename Linux deb
          for f in artifacts-linux/deb/*.deb; do
            rename_one "$f" "artifacts-linux/deb/larity_${VERSION}_amd64.deb"
          done
          # Rename Linux AppImage
          for f in artifacts-linux/appimage/*.AppImage; do
            rename_one "$f" "artifacts-linux/appimage/larity_${VERSION}_amd64.AppImage"
          done
          # Rename Linux RPM
          for f in artifacts-linux/rpm/*.rpm; do
            rename_one "$f" "artifacts-linux/rpm/larity_${VERSION}-1.x86_64.rpm"
          done
          # Rename Windows MSI
          for f in artifacts-windows/msi/*.msi; do
            rename_one "$f" "artifacts-windows/msi/larity_${VERSION}_x64_en-US.msi"
          done
          # Rename Windows EXE
          for f in artifacts-windows/nsis/*.exe; do
            rename_one "$f" "artifacts-windows/nsis/larity_${VERSION}_x64-setup.exe"
          done

      - name: Build Arch Linux package (makepkg)
        shell: bash
        run: |
          # Calculate local DEB checksum
          DEB_FILE=$(ls artifacts-linux/deb/*.deb)
          DEB_SHA256=$(sha256sum "$DEB_FILE" | cut -d' ' -f1)

          # Configure PKGBUILD version and checksum
          sed -i "s/__VERSION__/${{ env.VERSION }}/g" apps/desktop/PKGBUILD
          sed -i "s/sha256sums=('SKIP')/sha256sums=('${DEB_SHA256}')/g" apps/desktop/PKGBUILD
          cp artifacts-linux/deb/*.deb apps/desktop/

          # Adjust PKGBUILD source to local deb file for offline makepkg
          # shellcheck disable=SC2016
          sed -i 's/source=(.*)/source=("larity_${pkgver}_amd64.deb")/' apps/desktop/PKGBUILD

          # Compile package inside a pinned Arch image
          docker run --rm -v "$PWD:/app" -w /app archlinux:base-devel bash -c "pacman -Sy --noconfirm binutils && useradd -m builder && chown -R builder:builder apps/desktop && cd apps/desktop && sudo -u builder makepkg -fd"

          # Restore host ownership (makepkg ran as container 'builder' uid)
          sudo chown -R "$(id -u):$(id -g)" apps/desktop/

          # Move build output to main artifacts
          # shellcheck disable=SC2035
          mv apps/desktop/*.pkg.tar.zst artifacts-linux/

      - name: Configure NixOS default.nix derivation
        shell: bash
        run: |
          #!/bin/bash
          # shellcheck disable=SC2086
          DEB_FILE=$(ls artifacts-linux/deb/*.deb)
          DEB_SHA256=$(sha256sum "$DEB_FILE" | cut -d' ' -f1)
          sed -i "s/version = \".*\";/version = \"${{ env.VERSION }}\";/g" apps/desktop/default.nix
          sed -i "s/sha256 = \".*\";/sha256 = \"${DEB_SHA256}\";/g" apps/desktop/default.nix

          # Commit and push the updated default.nix back to the repository so nix run works
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/default.nix
          git commit -m "chore(nix): update derivation for release v${{ env.VERSION }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || echo "Failed to rebase on main"
          git push origin HEAD:main || echo "Failed to push updated derivation"

      - name: Generate Changelog and Release Body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Latest tag strictly older than the current release (exclude v$VERSION itself)
          PREV_TAG="$(git tag --sort=-creatordate | grep -v "^v${VERSION}$" | head -n1 || true)"

          {
            echo "![Larity Banner](https://github.com/user-attachments/assets/9314d788-93e8-4486-93c4-88225be0ffb7)"
            echo ""
            echo "## Changelog (Commits since last version)"

            if [ -n "${PREV_TAG}" ]; then
              git log "${PREV_TAG}..HEAD" --oneline --format="* %h - %s (%an)" || true
            else
              git log --oneline --format="* %h - %s (%an)" || true
            fi

            echo ""
            echo "## Contributors"

            CONTRIBUTORS=""
            if [ -n "${PREV_TAG}" ]; then
              CONTRIBUTORS="$(gh api "repos/${REPO}/compare/${PREV_TAG}...${SHA}" --jq '.commits[] | if .author then "* @" + .author.login else "* " + .commit.author.name end' 2>/dev/null | sort -u || true)"
            else
              CONTRIBUTORS="$(gh api "repos/${REPO}/commits?per_page=100" --jq '.[] | if .author then "* @" + .author.login else "* " + .commit.author.name end' 2>/dev/null | sort -u || true)"
            fi

            if [ -n "${CONTRIBUTORS}" ]; then
              echo "${CONTRIBUTORS}"
            else
              if [ -n "${PREV_TAG}" ]; then
                git log "${PREV_TAG}..HEAD" --format="* %an" | sort -u || true
              else
                git log --format="* %an" | sort -u || true
              fi
            fi
          } > release_body.md

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          shopt -s globstar
          sha256sum artifacts-linux/**/*.deb \
                    artifacts-linux/**/*.AppImage \
                    artifacts-linux/**/*.rpm \
                    artifacts-linux/**/*.pkg.tar.zst \
                    artifacts-windows/**/*.msi \
                    artifacts-windows/**/*.exe \
                    apps/desktop/PKGBUILD \
                    apps/desktop/default.nix > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: Larity ${{ github.ref_name }}
          body_path: release_body.md
          draft: true
          prerelease: false
          files: |
            artifacts-linux/**/*.deb
            artifacts-linux/**/*.AppImage
            artifacts-linux/**/*.rpm
            artifacts-linux/**/*.pkg.tar.zst
            artifacts-windows/**/*.msi
            artifacts-windows/**/*.exe
            apps/desktop/PKGBUILD
            apps/desktop/default.nix
            sha256sums.txt
