name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build-desktop-linux:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Restore Node Modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/bun.lock', '**/package-lock.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev alien

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "./apps/desktop"
          includeRelease: true

      - name: Convert DEB to RPM
        run: |
          #!/bin/bash
          # shellcheck disable=SC2035
          mkdir -p apps/desktop/src-tauri/target/release/bundle/rpm
          for deb in apps/desktop/src-tauri/target/release/bundle/deb/*.deb; do
            sudo alien --to-rpm --scripts "$deb"
            mv ./*.rpm apps/desktop/src-tauri/target/release/bundle/rpm/
          done

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Restore Node Modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/bun.lock', '**/package-lock.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "./apps/desktop"
          includeRelease: true

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-docker-realtime:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
            docker_platform: linux/amd64
          - platform: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/realtime/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/larity-realtime:${{ env.VERSION }}-${{ matrix.platform }}
          platforms: ${{ matrix.docker_platform }}

  build-docker-control:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
            docker_platform: linux/amd64
          - platform: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/control/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/larity-control:${{ env.VERSION }}-${{ matrix.platform }}
          platforms: ${{ matrix.docker_platform }}

  create-release:
    needs:
      [
        build-desktop-linux,
        build-desktop-windows,
        build-docker-realtime,
        build-docker-control,
      ]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Download Linux Desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: artifacts-linux

      - name: Download Windows Desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows
          path: artifacts-windows

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Process Version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create and Push Multi-arch Docker Manifests
        shell: bash
        run: |
          #!/bin/bash
          # shellcheck disable=SC2086
          # Realtime
          docker manifest create ghcr.io/${{ github.repository }}/larity-realtime:${{ env.VERSION }} \
            ghcr.io/${{ github.repository }}/larity-realtime:${{ env.VERSION }}-amd64 \
            ghcr.io/${{ github.repository }}/larity-realtime:${{ env.VERSION }}-arm64
          docker manifest create ghcr.io/${{ github.repository }}/larity-realtime:latest \
            ghcr.io/${{ github.repository }}/larity-realtime:${{ env.VERSION }}-amd64 \
            ghcr.io/${{ github.repository }}/larity-realtime:${{ env.VERSION }}-arm64
          docker manifest push ghcr.io/${{ github.repository }}/larity-realtime:${{ env.VERSION }}
          docker manifest push ghcr.io/${{ github.repository }}/larity-realtime:latest

          # Control
          docker manifest create ghcr.io/${{ github.repository }}/larity-control:${{ env.VERSION }} \
            ghcr.io/${{ github.repository }}/larity-control:${{ env.VERSION }}-amd64 \
            ghcr.io/${{ github.repository }}/larity-control:${{ env.VERSION }}-arm64
          docker manifest create ghcr.io/${{ github.repository }}/larity-control:latest \
            ghcr.io/${{ github.repository }}/larity-control:${{ env.VERSION }}-amd64 \
            ghcr.io/${{ github.repository }}/larity-control:${{ env.VERSION }}-arm64
          docker manifest push ghcr.io/${{ github.repository }}/larity-control:${{ env.VERSION }}
          docker manifest push ghcr.io/${{ github.repository }}/larity-control:latest

      - name: Build Arch Linux package (makepkg)
        shell: bash
        run: |
          # Configure PKGBUILD version
          sed -i "s/__VERSION__/${{ env.VERSION }}/g" apps/desktop/PKGBUILD
          cp artifacts-linux/*.deb apps/desktop/

          # Adjust PKGBUILD source to local deb file for offline makepkg
          # shellcheck disable=SC2016
          sed -i 's/source=(.*)/source=("larity_${pkgver}_amd64.deb")/' apps/desktop/PKGBUILD

          # Compile package inside Arch docker image
          docker run --rm -v "$PWD:/app" -w /app archlinux:latest bash -c "pacman -Sy --noconfirm base-devel binutils && useradd -m builder && chown -R builder:builder . && cd apps/desktop && sudo -u builder makepkg -f"

          # Move build output to main artifacts
          # shellcheck disable=SC2035
          mv apps/desktop/*.pkg.tar.zst artifacts-linux/

      - name: Configure NixOS default.nix derivation
        shell: bash
        run: |
          #!/bin/bash
          # shellcheck disable=SC2086
          DEB_FILE=$(ls artifacts-linux/*.deb)
          DEB_SHA256=$(sha256sum "$DEB_FILE" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${{ env.VERSION }}/g" apps/desktop/default.nix
          sed -i "s/sha256 = \".*\";/sha256 = \"${DEB_SHA256}\";/g" apps/desktop/default.nix

      - name: Generate Changelog and Release Body
        shell: bash
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"

          {
            echo "![Larity Banner](https://github.com/user-attachments/assets/9314d788-93e8-4486-93c4-88225be0ffb7)"
            echo ""
            echo "## Changelog (Commits since last version)"
            
            if [ -n "${PREV_TAG}" ]; then
              git log "${PREV_TAG}..HEAD" --oneline --format="* %h - %s (%an)"
              echo ""
              echo "## Contributors"
              git log "${PREV_TAG}..HEAD" --format="* @%an" | sort -u
            else
              git log --oneline --format="* %h - %s (%an)"
              echo ""
              echo "## Contributors"
              git log --format="* @%an" | sort -u
            fi
            
            echo ""
            echo "## Container Images (GHCR)"
            echo "* **Realtime Service:** \`ghcr.io/${{ github.repository }}/larity-realtime:${{ env.VERSION }}\`"
            echo "* **Control Service:** \`ghcr.io/${{ github.repository }}/larity-control:${{ env.VERSION }}\`"
          } > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Larity v${{ env.VERSION }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            artifacts-linux/**/*.deb
            artifacts-linux/**/*.AppImage
            artifacts-linux/**/*.rpm
            artifacts-linux/**/*.pkg.tar.zst
            artifacts-windows/**/*.msi
            artifacts-windows/**/*.exe
            apps/desktop/PKGBUILD
            apps/desktop/default.nix
