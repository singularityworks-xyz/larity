name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build-desktop-linux:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      VITE_CONTROL_URL: ${{ secrets.VITE_CONTROL_URL }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Restore Node Modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/bun.lock', '**/package-lock.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev alien

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "./apps/desktop"
          includeRelease: true

      - name: Convert DEB to RPM
        run: |
          #!/bin/bash
          # shellcheck disable=SC2035
          mkdir -p apps/desktop/src-tauri/target/release/bundle/rpm
          for deb in apps/desktop/src-tauri/target/release/bundle/deb/*.deb; do
            sudo alien --to-rpm --scripts "$deb"
            mv ./*.rpm apps/desktop/src-tauri/target/release/bundle/rpm/
          done

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

  build-desktop-windows:
    runs-on: windows-latest
    env:
      VITE_CONTROL_URL: ${{ secrets.VITE_CONTROL_URL }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Restore Node Modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/bun.lock', '**/package-lock.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "./apps/desktop"
          includeRelease: true

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-docker-realtime:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
            docker_platform: linux/amd64
          - platform: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/realtime/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/realtime:${{ env.VERSION }}-${{ matrix.platform }}
          platforms: ${{ matrix.docker_platform }}
          provenance: false

  build-docker-control:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
            docker_platform: linux/amd64
          - platform: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/control/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/control:${{ env.VERSION }}-${{ matrix.platform }}
          platforms: ${{ matrix.docker_platform }}
          provenance: false

  create-release:
    needs:
      [
        build-desktop-linux,
        build-desktop-windows,
        build-docker-realtime,
        build-docker-control,
      ]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Download Linux Desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: artifacts-linux

      - name: Download Windows Desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows
          path: artifacts-windows

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Process Version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Rename Desktop Artifacts to Match Release Version
        shell: bash
        run: |
          # Rename Linux deb
          for f in artifacts-linux/deb/*.deb; do
            [ -e "$f" ] && mv "$f" "artifacts-linux/deb/larity_${VERSION}_amd64.deb"
          done
          # Rename Linux AppImage
          for f in artifacts-linux/appimage/*.AppImage; do
            [ -e "$f" ] && mv "$f" "artifacts-linux/appimage/larity_${VERSION}_amd64.AppImage"
          done
          # Rename Linux RPM
          for f in artifacts-linux/rpm/*.rpm; do
            [ -e "$f" ] && mv "$f" "artifacts-linux/rpm/larity_${VERSION}-1.x86_64.rpm"
          done
          # Rename Windows MSI
          for f in artifacts-windows/msi/*.msi; do
            [ -e "$f" ] && mv "$f" "artifacts-windows/msi/larity_${VERSION}_x64_en-US.msi"
          done
          # Rename Windows EXE
          for f in artifacts-windows/nsis/*.exe; do
            [ -e "$f" ] && mv "$f" "artifacts-windows/nsis/larity_${VERSION}_x64-setup.exe"
          done

      - name: Create and Push Multi-arch Docker Manifests
        shell: bash
        run: |
          #!/bin/bash
          # shellcheck disable=SC2086
          # Realtime
          docker manifest create ghcr.io/${{ github.repository }}/realtime:${{ env.VERSION }} \
            ghcr.io/${{ github.repository }}/realtime:${{ env.VERSION }}-amd64 \
            ghcr.io/${{ github.repository }}/realtime:${{ env.VERSION }}-arm64
          docker manifest create ghcr.io/${{ github.repository }}/realtime:latest \
            ghcr.io/${{ github.repository }}/realtime:${{ env.VERSION }}-amd64 \
            ghcr.io/${{ github.repository }}/realtime:${{ env.VERSION }}-arm64
          docker manifest push ghcr.io/${{ github.repository }}/realtime:${{ env.VERSION }}
          docker manifest push ghcr.io/${{ github.repository }}/realtime:latest

          # Control
          docker manifest create ghcr.io/${{ github.repository }}/control:${{ env.VERSION }} \
            ghcr.io/${{ github.repository }}/control:${{ env.VERSION }}-amd64 \
            ghcr.io/${{ github.repository }}/control:${{ env.VERSION }}-arm64
          docker manifest create ghcr.io/${{ github.repository }}/control:latest \
            ghcr.io/${{ github.repository }}/control:${{ env.VERSION }}-amd64 \
            ghcr.io/${{ github.repository }}/control:${{ env.VERSION }}-arm64
          docker manifest push ghcr.io/${{ github.repository }}/control:${{ env.VERSION }}
          docker manifest push ghcr.io/${{ github.repository }}/control:latest

      - name: Build Arch Linux package (makepkg)
        shell: bash
        run: |
          # Calculate local DEB checksum
          DEB_FILE=$(ls artifacts-linux/deb/*.deb)
          DEB_SHA256=$(sha256sum "$DEB_FILE" | cut -d' ' -f1)

          # Configure PKGBUILD version and checksum
          sed -i "s/__VERSION__/${{ env.VERSION }}/g" apps/desktop/PKGBUILD
          sed -i "s/sha256sums=('SKIP')/sha256sums=('${DEB_SHA256}')/g" apps/desktop/PKGBUILD
          cp artifacts-linux/deb/*.deb apps/desktop/

          # Adjust PKGBUILD source to local deb file for offline makepkg
          # shellcheck disable=SC2016
          sed -i 's/source=(.*)/source=("larity_${pkgver}_amd64.deb")/' apps/desktop/PKGBUILD

          # Compile package inside Arch docker image
          docker run --rm -v "$PWD:/app" -w /app archlinux:latest bash -c "pacman -Sy --noconfirm base-devel binutils && useradd -m builder && chown -R builder:builder . && cd apps/desktop && sudo -u builder makepkg -fd"

          # Restore ownership of files to the runner user
          sudo chown -R $(id -u):$(id -g) .

          # Move build output to main artifacts
          # shellcheck disable=SC2035
          mv apps/desktop/*.pkg.tar.zst artifacts-linux/

      - name: Configure NixOS default.nix derivation
        shell: bash
        run: |
          #!/bin/bash
          # shellcheck disable=SC2086
          DEB_FILE=$(ls artifacts-linux/deb/*.deb)
          DEB_SHA256=$(sha256sum "$DEB_FILE" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${{ env.VERSION }}/g" apps/desktop/default.nix
          sed -i "s/sha256 = \".*\";/sha256 = \"${DEB_SHA256}\";/g" apps/desktop/default.nix

          # Commit and push the updated default.nix back to the repository so nix run works
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/default.nix
          git commit -m "chore(nix): update derivation for release v${{ env.VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:release --force || echo "Failed to push updated derivation"

      - name: Generate Changelog and Release Body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"

          {
            echo "![Larity Banner](https://github.com/user-attachments/assets/9314d788-93e8-4486-93c4-88225be0ffb7)"
            echo ""
            echo "## Changelog (Commits since last version)"
            
            if [ -n "${PREV_TAG}" ]; then
              git log "${PREV_TAG}..HEAD" --oneline --format="* %h - %s (%an)"
            else
              git log --oneline --format="* %h - %s (%an)"
            fi
            
            echo ""
            echo "## Contributors"
            
            CONTRIBUTORS=""
            if [ -n "${PREV_TAG}" ]; then
              CONTRIBUTORS=$(gh api "repos/:owner/:repo/compare/${PREV_TAG}...HEAD" --jq '.commits[] | if .author then "* @" + .author.login else "* " + .commit.author.name end' 2>/dev/null | sort -u)
            else
              CONTRIBUTORS=$(gh api "repos/:owner/:repo/commits?per_page=100" --jq '.[] | if .author then "* @" + .author.login else "* " + .commit.author.name end' 2>/dev/null | sort -u)
            fi
            
            if [ -n "${CONTRIBUTORS}" ]; then
              echo "${CONTRIBUTORS}"
            else
              if [ -n "${PREV_TAG}" ]; then
                git log "${PREV_TAG}..HEAD" --format="* %an" | sort -u
              else
                git log --format="* %an" | sort -u
              fi
            fi
            
            echo ""
            echo "## Container Images (GHCR)"
            echo "* **Realtime Service:** \`ghcr.io/${{ github.repository }}/realtime:${{ env.VERSION }}\`"
            echo "* **Control Service:** \`ghcr.io/${{ github.repository }}/control:${{ env.VERSION }}\`"
          } > release_body.md

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          shopt -s globstar
          sha256sum artifacts-linux/**/*.deb \
                    artifacts-linux/**/*.AppImage \
                    artifacts-linux/**/*.rpm \
                    artifacts-linux/**/*.pkg.tar.zst \
                    artifacts-windows/**/*.msi \
                    artifacts-windows/**/*.exe \
                    apps/desktop/PKGBUILD \
                    apps/desktop/default.nix > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Larity v${{ env.VERSION }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            artifacts-linux/**/*.deb
            artifacts-linux/**/*.AppImage
            artifacts-linux/**/*.rpm
            artifacts-linux/**/*.pkg.tar.zst
            artifacts-windows/**/*.msi
            artifacts-windows/**/*.exe
            apps/desktop/PKGBUILD
            apps/desktop/default.nix
            sha256sums.txt

