<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/images/larity-logo-dark.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larity</title>
    <style>
    html,
    body {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      color: #ededed;
      -webkit-user-select: none;
      user-select: none;
      background-color: #0b0c0e;
    }
    #pre-bootstrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0c0e;
    }
    .pre-header {
      display: flex;
      align-items: center;
      width: 100%;
      height: 36px;
      padding-left: 16px;
    }
    .pre-title {
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 11px;
      color: #52525b;
      letter-spacing: 0.22em;
    }
    .pre-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pre-logo {
      width: 40px;
      height: 37px;
      animation: preLogoBreathe 3s ease-in-out infinite;
    }
    .pre-step-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 24px;
    }
    .pre-matrix {
      display: grid;
      grid-template-rows: repeat(5, 2.5px);
      grid-template-columns: repeat(5, 2.5px);
      gap: 2px;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
    }
    .pre-dot {
      width: 2.5px;
      height: 2.5px;
      background-color: #ededed;
      border-radius: 999px;
      opacity: 0.12;
      animation: preDotWave 1.6s ease-in-out infinite;
    }
    .pre-label {
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
      letter-spacing: -0.01em;
    }
    .pre-bar-container {
      width: 144px;
      height: 1.5px;
      margin-top: 16px;
      overflow: hidden;
      background: #27272a;
      border-radius: 999px;
    }
    .pre-bar {
      width: 25%;
      height: 100%;
      background: #ededed;
    }
    .pre-footer {
      width: 100%;
      height: 36px;
    }
    @keyframes preLogoBreathe {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.03);
        opacity: 1;
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.15));
      }
    }
    @keyframes preDotWave {
      0%,
      100% {
        opacity: 0.12;
      }
      50% {
        opacity: 0.95;
      }
    }
    .pre-dot:nth-child(5n + 1) {
      animation-delay: 0s;
    }
    .pre-dot:nth-child(5n + 2) {
      animation-delay: 0.15s;
    }
    .pre-dot:nth-child(5n + 3) {
      animation-delay: 0.3s;
    }
    .pre-dot:nth-child(5n + 4) {
      animation-delay: 0.45s;
    }
    .pre-dot:nth-child(5n + 5) {
      animation-delay: 0.6s;
    }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="pre-bootstrap" data-tauri-drag-region>
        <div class="pre-header" data-tauri-drag-region>
          <span class="pre-title">LARITY</span>
        </div>
        <div class="pre-center">
          <img src="/images/larity-logo-dark.svg" alt="Larity" class="pre-logo">
          <div class="pre-step-row">
            <div class="pre-matrix">
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
            </div>
            <span class="pre-label">Initializing runtime...</span>
          </div>
          <div class="pre-bar-container">
            <div class="pre-bar"></div>
          </div>
        </div>
        <div class="pre-footer"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
