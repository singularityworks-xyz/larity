<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/images/larity-logo-dark.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larity</title>
    <style>
    html,
    body {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      color: #ededed;
      -webkit-user-select: none;
      user-select: none;
      background-color: #0b0c0e;
    }
    #pre-bootstrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0c0e;
    }
    .pre-header {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      width: 100%;
      height: 44px;
      padding-left: 20px;
    }
    .pre-title {
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 12px;
      font-weight: 500;
      color: #71717a;
      letter-spacing: 0.24em;
    }
    .pre-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 48px;
    }
    .pre-logo {
      width: 58px;
      height: 52px;
      filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.09));
      animation: preLogoBreathe 3.5s ease-in-out infinite;
    }
    .pre-step-row {
      display: flex;
      gap: 12px;
      align-items: center;
      height: 28px;
      margin-top: 32px;
    }
    .pre-matrix {
      display: grid;
      grid-template-rows: repeat(5, 3.5px);
      grid-template-columns: repeat(5, 3.5px);
      gap: 2px;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }
    .pre-dot {
      width: 3.5px;
      height: 3.5px;
      background-color: #f4f4f5;
      border-radius: 999px;
      opacity: 0.1;
      animation: preDotUpwardSurge 1.6s cubic-bezier(0.42, 0, 0.58, 1) infinite;
      will-change: opacity, filter;
    }
    @keyframes preDotUpwardSurge {
      0%,
      100% {
        opacity: 0.1;
        filter: none;
      }
      45% {
        opacity: 1;
        filter: drop-shadow(0 0 2.5px rgba(255, 255, 255, 0.6))
          drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
      }
    }
    /* Upward Wave: Row 4 (Bottom) -> Row 0 (Top) */
    .r4 {
      animation-delay: 0s;
    }
    .r3 {
      animation-delay: 0.22s;
    }
    .r2 {
      animation-delay: 0.44s;
    }
    .r1 {
      animation-delay: 0.66s;
    }
    .r0 {
      animation-delay: 0.88s;
    }
    .pre-label {
      font-size: 13px;
      font-weight: 500;
      color: #e4e4e7;
      letter-spacing: -0.01em;
    }
    .pre-bar-container {
      width: 208px;
      height: 2px;
      margin-top: 20px;
      overflow: hidden;
      background: #27272a;
      border-radius: 999px;
    }
    .pre-bar {
      width: 25%;
      height: 100%;
      background: #e4e4e7;
    }
    .pre-footer {
      width: 100%;
      height: 44px;
    }
    @keyframes preLogoBreathe {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
        filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.14));
      }
    }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="pre-bootstrap" data-tauri-drag-region>
        <div class="pre-header" data-tauri-drag-region>
          <span class="pre-title">LARITY</span>
        </div>
        <div class="pre-center">
          <img src="/images/larity-logo-dark.svg" alt="Larity" class="pre-logo">
          <div class="pre-step-row">
            <div class="pre-matrix" aria-hidden="true">
              <!-- Row 0 (Top) -->
              <span class="pre-dot r0"></span><span class="pre-dot r0"></span
              ><span class="pre-dot r0"></span><span class="pre-dot r0"></span
              ><span class="pre-dot r0"></span>
              <!-- Row 1 -->
              <span class="pre-dot r1"></span><span class="pre-dot r1"></span
              ><span class="pre-dot r1"></span><span class="pre-dot r1"></span
              ><span class="pre-dot r1"></span>
              <!-- Row 2 -->
              <span class="pre-dot r2"></span><span class="pre-dot r2"></span
              ><span class="pre-dot r2"></span><span class="pre-dot r2"></span
              ><span class="pre-dot r2"></span>
              <!-- Row 3 -->
              <span class="pre-dot r3"></span><span class="pre-dot r3"></span
              ><span class="pre-dot r3"></span><span class="pre-dot r3"></span
              ><span class="pre-dot r3"></span>
              <!-- Row 4 (Bottom) -->
              <span class="pre-dot r4"></span><span class="pre-dot r4"></span
              ><span class="pre-dot r4"></span><span class="pre-dot r4"></span
              ><span class="pre-dot r4"></span>
            </div>
            <span class="pre-label">Initializing runtime...</span>
          </div>
          <div class="pre-bar-container">
            <div class="pre-bar"></div>
          </div>
        </div>
        <div class="pre-footer"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
