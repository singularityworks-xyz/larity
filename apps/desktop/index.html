<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/images/larity-logo-dark.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larity</title>
    <style>
    html,
    body {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      color: #ededed;
      -webkit-user-select: none;
      user-select: none;
      background-color: #0b0c0e;
    }
    #pre-bootstrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0c0e;
    }
    .pre-ambient-layer {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      height: 68%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
    .pre-ambient-base {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 90% 85% at 50% 115%,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.075) 36%,
        rgba(255, 255, 255, 0.02) 65%,
        transparent 85%
      );
      animation: preAmbientAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .pre-ambient-orb-1 {
      position: absolute;
      bottom: -30px;
      left: 20%;
      width: 650px;
      height: 380px;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0.045) 45%,
        transparent 75%
      );
      border-radius: 9999px;
      filter: blur(80px);
      animation:
        preAmbientAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        preAmbientDrift1 14s ease-in-out 1s infinite alternate;
    }
    .pre-ambient-orb-2 {
      position: absolute;
      right: 20%;
      bottom: -30px;
      width: 620px;
      height: 360px;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.038) 50%,
        transparent 75%
      );
      border-radius: 9999px;
      filter: blur(90px);
      animation:
        preAmbientAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        preAmbientDrift2 18s ease-in-out 1s infinite alternate;
    }
    .pre-ambient-orb-center {
      position: absolute;
      bottom: -20px;
      left: 50%;
      width: 540px;
      height: 300px;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.055) 45%,
        transparent 80%
      );
      border-radius: 9999px;
      filter: blur(70px);
      animation:
        preAmbientAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        preAmbientBreathe 10s ease-in-out 1s infinite alternate;
    }
    .pre-ambient-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        transparent 0%,
        rgba(11, 12, 14, 0.15) 70%,
        #0b0c0e 100%
      );
    }
    @keyframes preAmbientAppear {
      0% {
        opacity: 0;
        transform: translate3d(0, 20px, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    @keyframes preAmbientDrift1 {
      0% {
        transform: translate3d(-50%, 0, 0) scale(1);
        opacity: 0.8;
      }
      50% {
        transform: translate3d(-32%, -24px, 0) scale(1.1);
        opacity: 1;
      }
      100% {
        transform: translate3d(-64%, 18px, 0) scale(0.92);
        opacity: 0.75;
      }
    }
    @keyframes preAmbientDrift2 {
      0% {
        transform: translate3d(50%, 0, 0) scale(1);
        opacity: 0.75;
      }
      50% {
        transform: translate3d(32%, 20px, 0) scale(0.92);
        opacity: 1;
      }
      100% {
        transform: translate3d(64%, -24px, 0) scale(1.08);
        opacity: 0.7;
      }
    }
    @keyframes preAmbientBreathe {
      0% {
        transform: translate3d(-50%, 0, 0) scale(1);
        opacity: 0.85;
      }
      100% {
        transform: translate3d(-50%, -16px, 0) scale(1.14);
        opacity: 1;
      }
    }
    .pre-header {
      position: relative;
      z-index: 10;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      width: 100%;
      height: 44px;
      padding-left: 20px;
    }
    .pre-title {
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 12px;
      font-weight: 500;
      color: #71717a;
      letter-spacing: 0.24em;
    }
    .pre-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 48px;
    }
    .pre-logo {
      width: 58px;
      height: 52px;
      filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.09));
      animation: preLogoBreathe 3.5s ease-in-out infinite;
    }
    .pre-step-row {
      display: flex;
      gap: 12px;
      align-items: center;
      height: 28px;
      margin-top: 32px;
    }
    .pre-matrix {
      display: grid;
      grid-template-rows: repeat(5, 3.5px);
      grid-template-columns: repeat(5, 3.5px);
      gap: 2px;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }
    .pre-dot {
      width: 3.5px;
      height: 3.5px;
      background-color: #f4f4f5;
      border-radius: 999px;
      opacity: 0.1;
      animation: preDotEqualizer 1.5s ease-in-out infinite;
    }
    .pre-label {
      font-size: 13px;
      font-weight: 500;
      color: #e4e4e7;
      letter-spacing: -0.01em;
    }
    .pre-bar-container {
      width: 208px;
      height: 2px;
      margin-top: 20px;
      overflow: hidden;
      background: #27272a;
      border-radius: 999px;
    }
    .pre-bar {
      width: 25%;
      height: 100%;
      background: #e4e4e7;
    }
    .pre-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 44px;
    }
    @keyframes preLogoBreathe {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
        filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.14));
      }
    }
    @keyframes preDotEqualizer {
      0%,
      100% {
        opacity: 0.1;
      }
      50% {
        opacity: 0.95;
      }
    }
    .pre-dot:nth-child(5n + 1) {
      animation-delay: 0s;
    }
    .pre-dot:nth-child(5n + 2) {
      animation-delay: 0.25s;
    }
    .pre-dot:nth-child(5n + 3) {
      animation-delay: 0.12s;
    }
    .pre-dot:nth-child(5n + 4) {
      animation-delay: 0.38s;
    }
    .pre-dot:nth-child(5n + 5) {
      animation-delay: 0.18s;
    }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="pre-bootstrap" data-tauri-drag-region>
        <div class="pre-ambient-layer" aria-hidden="true">
          <div class="pre-ambient-base"></div>
          <div class="pre-ambient-orb-1"></div>
          <div class="pre-ambient-orb-2"></div>
          <div class="pre-ambient-orb-center"></div>
          <div class="pre-ambient-vignette"></div>
        </div>
        <div class="pre-header" data-tauri-drag-region>
          <span class="pre-title">LARITY</span>
        </div>
        <div class="pre-center">
          <img src="/images/larity-logo-dark.svg" alt="Larity" class="pre-logo">
          <div class="pre-step-row">
            <div class="pre-matrix">
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
              <span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span><span class="pre-dot"></span
              ><span class="pre-dot"></span>
            </div>
            <span class="pre-label">Initializing runtime...</span>
          </div>
          <div class="pre-bar-container">
            <div class="pre-bar"></div>
          </div>
        </div>
        <div class="pre-footer"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
