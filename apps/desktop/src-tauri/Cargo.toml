[package]
name = "larity"
version = "0.1.6"
description = "Your meetings forget nothing. Decisions, commitments, constraints captured in real-time, surfaced when it matters."
authors = ["Singularity Works<itssingularity.com>", "Aman Aziz<aman.itssingularity.com>", "Parazeeknova<przknv.cc>"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
cpal = "0.17.3"
rubato = "0.14.1"
tokio = { version = "1.52.3", features = ["full"] }
byteorder = "1.5.0"
thiserror = "2.0.18"
base64 = "0.22.1"
voice_activity_detector = "0.2.1"
window-vibrancy = "0.7.1"
tauri-plugin-http = "2.5.9"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1.5.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
rfd = "0.17.2"


