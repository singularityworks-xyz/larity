pre-commit:
  jobs:
    - name: lint
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bun x ultracite check {staged_files}
    - name: typecheck
      glob: "**/*.{ts,tsx}"
      run: bun run check-types
    - name: version-bump
      run: bun scripts/version-manager.ts
      stage_fixed: true
    - name: rust-fmt
      glob: "apps/desktop/src-tauri/**/*.rs"
      run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      stage_fixed: true
    - name: rust-clippy
      glob: "apps/desktop/src-tauri/**/*.rs"
      run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

